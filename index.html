<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Ripple Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Decision Ripple Simulator</h1>

<div id="choices">
    <button class="choice-btn" data-choice="study">Study Today</button>
    <button class="choice-btn" data-choice="tv">Watch TV</button>
    <button class="choice-btn" data-choice="exercise">Exercise</button>
    <button class="choice-btn" data-choice="sleep">Take a Nap</button>
    <button class="choice-btn" data-choice="friends">Go with Friends</button>
</div>

<div id="ripple-container"></div>
<div id="outcome"></div>
<img id="decision-image" src="" alt="Decision Image">
<img id="ripple-image" src="" alt="Ripple Image">
<script src="script.js"></script>
</body>
</html>
